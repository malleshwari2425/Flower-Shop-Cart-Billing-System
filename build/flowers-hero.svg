<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb6d0"/>
      <stop offset="0.55" stop-color="#ffd6e7"/>
      <stop offset="1" stop-color="#b7f7d5"/>
    </linearGradient>
    <radialGradient id="petal" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff6aa9" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>

  <rect width="1200" height="270" fill="url(#bg)"/>

  <!-- Soft sparkles -->
  <g opacity="0.35" filter="url(#soft)" fill="#ffffff">
    <circle cx="90" cy="55" r="4"/>
    <circle cx="160" cy="95" r="3"/>
    <circle cx="260" cy="60" r="2.6"/>
    <circle cx="1040" cy="50" r="4"/>
    <circle cx="980" cy="110" r="3"/>
    <circle cx="860" cy="70" r="2.8"/>
    <circle cx="700" cy="115" r="3.5"/>
    <circle cx="560" cy="60" r="2.4"/>
  </g>

  <!-- Decorative flowers -->
  <g opacity="0.95">
    <!-- Flower template: petals as circles + center -->
    <g transform="translate(140 190)">
      <g fill="url(#petal)">
        <circle cx="0" cy="-22" r="14"/>
        <circle cx="19" cy="-10" r="14"/>
        <circle cx="19" cy="12" r="14"/>
        <circle cx="0" cy="22" r="14"/>
        <circle cx="-19" cy="12" r="14"/>
        <circle cx="-19" cy="-10" r="14"/>
      </g>
      <circle cx="0" cy="0" r="16" fill="#10b981"/>
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" opacity="0.35"/>
    </g>

    <g transform="translate(320 150) scale(0.85)">
      <g fill="url(#petal)">
        <circle cx="0" cy="-22" r="14"/>
        <circle cx="19" cy="-10" r="14"/>
        <circle cx="19" cy="12" r="14"/>
        <circle cx="0" cy="22" r="14"/>
        <circle cx="-19" cy="12" r="14"/>
        <circle cx="-19" cy="-10" r="14"/>
      </g>
      <circle cx="0" cy="0" r="16" fill="#ff6aa9"/>
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" opacity="0.3"/>
    </g>

    <g transform="translate(510 200) scale(0.78)">
      <g fill="url(#petal)">
        <circle cx="0" cy="-22" r="14"/>
        <circle cx="19" cy="-10" r="14"/>
        <circle cx="19" cy="12" r="14"/>
        <circle cx="0" cy="22" r="14"/>
        <circle cx="-19" cy="12" r="14"/>
        <circle cx="-19" cy="-10" r="14"/>
      </g>
      <circle cx="0" cy="0" r="16" fill="#f59e0b"/>
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" opacity="0.3"/>
    </g>

    <g transform="translate(760 135) scale(0.95)">
      <g fill="url(#petal)">
        <circle cx="0" cy="-22" r="14"/>
        <circle cx="19" cy="-10" r="14"/>
        <circle cx="19" cy="12" r="14"/>
        <circle cx="0" cy="22" r="14"/>
        <circle cx="-19" cy="12" r="14"/>
        <circle cx="-19" cy="-10" r="14"/>
      </g>
      <circle cx="0" cy="0" r="16" fill="#10b981"/>
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" opacity="0.35"/>
    </g>

    <g transform="translate(980 185) scale(0.85)">
      <g fill="url(#petal)">
        <circle cx="0" cy="-22" r="14"/>
        <circle cx="19" cy="-10" r="14"/>
        <circle cx="19" cy="12" r="14"/>
        <circle cx="0" cy="22" r="14"/>
        <circle cx="-19" cy="12" r="14"/>
        <circle cx="-19" cy="-10" r="14"/>
      </g>
      <circle cx="0" cy="0" r="16" fill="#ff6aa9"/>
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- Foreground leaves -->
  <g opacity="0.35" fill="#047857">
    <path d="M820 240c50-25 95-25 150 0c-55 25-100 25-150 0z"/>
    <path d="M120 250c55-22 105-22 160 0c-60 24-110 24-160 0z"/>
    <path d="M420 250c45-20 85-20 130 0c-48 22-88 22-130 0z"/>
  </g>
</svg>

